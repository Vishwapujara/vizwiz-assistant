name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = minimum supported; 3.13 = what Colab runs (see results/env/).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,serve]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest

  dashboard:
    # Results dashboard (D-067): type-check, build (which rebuilds results.db from
    # results/*.json, so a malformed results file fails here), then query the API.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: API answers from the results database
        run: |
          cp -r .next/static .next/standalone/.next/static
          (cd .next/standalone && PORT=3077 node server.js &)
          for i in $(seq 30); do curl -sf localhost:3077/api/trpc/health && break; sleep 1; done
          curl -sf localhost:3077/api/trpc/load.capacity \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0)).result.data; console.log(d[0]); if (!(d[0].sloRps > 0)) process.exit(1)"

  compose-smoke:
    # Builds the image and runs gateway + mock model + Prometheus, then sends
    # synthetic traffic and checks every cascade branch was reached and scraped.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f docker/docker-compose.yml up --build -d --wait model gateway prometheus
      - name: Synthetic traffic
        run: |
          docker compose -f docker/docker-compose.yml --profile demo run --rm traffic \
            python -m vizwiz.bench.traffic --url http://gateway:8080 --rps 5 --duration 20 | tee traffic.log
          grep -q "'answered'" traffic.log && grep -q "'unanswerable'" traffic.log
      - name: Prometheus has the gateway metrics
        run: |
          sleep 10
          curl -sf -G localhost:9090/api/v1/query --data-urlencode 'query=sum(vizwiz_requests_total)' \
            | python3 -c "import json,sys; v=float(json.load(sys.stdin)['data']['result'][0]['value'][1]); print('requests scraped:', v); assert v > 50"
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 100
      - name: Stop stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down
