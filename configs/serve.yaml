# Gateway settings (Step 5.2, D-059). Env overrides: VIZWIZ_SERVE_CONFIG (this file's
# path), VIZWIZ_MODEL_URL (model server), VIZWIZ_MODEL_API_KEY (if vLLM uses --api-key),
# VIZWIZ_ADMIN_TOKEN (enables the adapter admin endpoints; unset = disabled).
model_url: http://localhost:8000      # vLLM OpenAI-compatible server, or the mock
adapters:                             # per stage: LoRA name on the server, or the registry
                                      # collection when the registry is on (E5 for all, D-056)
  quality: e5-multi-lora
  answerability: e5-multi-lora
  answer: e5-multi-lora
max_pixels: 524288                    # same budget as training and eval (D-050)
image_format: jpeg                    # photo re-encoded once after resizing; png = lossless
jpeg_quality: 95
mode: parallel_checks                 # sequential | parallel_checks | speculative
rules:
  answerability_threshold: 0.10       # decline when P(unanswerable) >= this; chosen on val (D-063)
  unusable_labels: []                 # quality labels that force a retake whatever the question;
                                      # empty = tips only (D-064); [unrecognizable] = hard gate
  max_tips: 2                         # retake tips shown at most
timeouts:
  model_call_s: 20
  retries: 2                          # on connection errors, 429 and 5xx
  backoff_s: 0.2                      # doubled after each retry
limits:
  max_upload_mb: 10
  max_question_chars: 500
registry:                             # W&B artifacts with a production alias (D-026, D-061)
  enabled: false                      # true: resolve, download and load adapters at startup
  project: vizwiz-assistant
  alias: production
  cache_dir: /tmp/vizwiz-adapters
  base_model: Qwen/Qwen3-VL-4B-Instruct
  max_lora_rank: 16
